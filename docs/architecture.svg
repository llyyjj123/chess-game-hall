<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-label="棋类游戏大厅架构图">
  <title>棋类游戏大厅架构</title>
  <desc>浏览器端负责游戏规则、AI、渲染与联机管理；Node 服务端负责静态托管、房间时钟与走子校验；两端通过 Socket.IO 通信。</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="316" fill="#FFFFFF"/>

  <!-- 浏览器 -->
  <text x="20" y="26" font-size="13" font-weight="600" fill="#0C447C" font-family="system-ui, sans-serif">浏览器 · 客户端</text>

  <rect x="20" y="38" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="34" y="62" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">游戏规则 + AI</text>
  <text x="34" y="82" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">四套独立规则引擎</text>
  <text x="34" y="99" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">minimax + α-β 剪枝</text>

  <rect x="240" y="38" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="254" y="62" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">渲染 · 音效 · 主题</text>
  <text x="254" y="82" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">Canvas 2D · DPR 适配</text>
  <text x="254" y="99" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">Web Audio 合成音效</text>

  <rect x="460" y="38" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="474" y="62" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">联机管理器</text>
  <text x="474" y="82" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">走子序号 · 断线重连</text>
  <text x="474" y="99" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">局面哈希 · 本地倒计时</text>

  <!-- 通信层 -->
  <path d="M120 122 L120 158" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M560 158 L560 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="200" y="128" width="280" height="26" rx="13" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="145" font-size="12" text-anchor="middle" fill="#5F5E5A" font-family="system-ui, sans-serif">Socket.IO（WebSocket）</text>

  <!-- 服务端 -->
  <text x="20" y="184" font-size="13" font-weight="600" fill="#0C447C" font-family="system-ui, sans-serif">Node.js · 服务端</text>

  <rect x="20" y="196" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="34" y="220" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">静态托管</text>
  <text x="34" y="240" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">只暴露 public/ 目录</text>
  <text x="34" y="257" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">源码与依赖不可访问</text>

  <rect x="240" y="196" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="254" y="220" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">房间与时钟</text>
  <text x="254" y="240" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">6 位房间码 · 建房限流</text>
  <text x="254" y="257" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">每方 10 分钟包干</text>

  <rect x="460" y="196" width="200" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="474" y="220" font-size="13" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">走子校验</text>
  <text x="474" y="240" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">成员 · 回合 · 序号</text>
  <text x="474" y="257" font-size="11" fill="#185FA5" font-family="system-ui, sans-serif">双端局面指纹比对</text>

  <text x="20" y="300" font-size="11" fill="#888780" font-family="system-ui, sans-serif">前端零框架、零构建；AI 全部在浏览器本地运行，不调用任何外部 API</text>
</svg>
